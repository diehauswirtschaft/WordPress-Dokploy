services:
  wordpress:
    build: .
#    image: ghcr.io/wzul/wordpress-dokploy:latest
    volumes:
      - wp_app:/var/www/html
    init: true
    env_file: ".env"
    # Reach the site's own domain via the Docker host (Traefik), as the
    # public IP is not reachable from inside (no hairpin NAT). Needed for
    # WordPress loopback requests, LiteSpeed purges and Matomo archiving.
    extra_hosts:
      - "${SERVER_HOSTNAME:?SERVER_HOSTNAME must be set}:host-gateway"
    restart: unless-stopped

  mail-relay:
    build: ./mail-relay
#    image: ghcr.io/wzul/wordpress-dokploy-mail-relay:latest
    env_file: ".env"
    restart: unless-stopped

  mariadb:
    build: ./mariadb
#    image: ghcr.io/wzul/wordpress-dokploy-mariadb:latest
    env_file: ".env"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress_password}
      MARIADB_AUTO_UPGRADE: ${MARIADB_AUTO_UPGRADE:-1}

  valkey:
    image: valkey/valkey:latest
    command: valkey-server --protected-mode no --maxmemory ${VALKEY_MAX_MEMORY:-64mb} --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    profiles:
      - tools
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 64M
    depends_on:
      - mariadb
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:2-stable
    profiles:
      - tools
    user: "0:0"
    environment:
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD:-admin}
    volumes:
      - wp_app:/srv
      - filebrowser_data:/home/filebrowser/data
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v11
    profiles:
      - debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1
    profiles:
      - mailpit
    restart: unless-stopped

volumes:
  wp_app:
  db_data:
  filebrowser_data:
